<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img"><style>
text{font-family:Inter,Arial,sans-serif;fill:#172033}.title{font-size:38px;font-weight:760;letter-spacing:-1px}.sub{font-size:17px;fill:#516079}.label{font-size:15px;font-weight:680}.small{font-size:12px;fill:#64748b}.box{fill:#fff;stroke:#cad5e5;stroke-width:1.5}.accent{fill:#eef2ff;stroke:#818cf8;stroke-width:1.7}.cyan{fill:#ecfeff;stroke:#22d3ee;stroke-width:1.7}.dark{fill:#172033}.line{stroke:#65758b;stroke-width:2;fill:none;marker-end:url(#a)}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#65758b"/></marker><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6366f1"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs><rect width="1200" height="630" fill="#f8fafc"/>
<text x="70" y="70" class="title">A research map across geometry, platform, and task</text><text x="70" y="102" class="sub">Original conceptual taxonomy — not a reproduction of any paper figure</text>
<rect x="70" y="150" width="225" height="350" rx="20" class="accent"/><text x="105" y="195" class="label">GEOMETRY</text><text x="105" y="240">2D planar scans</text><text x="105" y="285">3D point clouds</text><text x="105" y="330">Range images</text><text x="105" y="375">Voxels / pillars</text><text x="105" y="420">Meshes / maps</text>
<rect x="355" y="150" width="225" height="350" rx="20" class="cyan"/><text x="390" y="195" class="label">PLATFORM</text><text x="390" y="240">Robot / handheld</text><text x="390" y="285">Vehicle / rail</text><text x="390" y="330">Terrestrial static</text><text x="390" y="375">Backpack / mobile</text><text x="390" y="420">Aircraft / drone</text>
<rect x="640" y="150" width="225" height="350" rx="20" class="accent"/><text x="675" y="195" class="label">ENVIRONMENT</text><text x="675" y="240">Indoor</text><text x="675" y="285">Urban / road</text><text x="675" y="330">Off-road / natural</text><text x="675" y="375">Industrial</text><text x="675" y="420">Aerial / regional</text>
<rect x="925" y="150" width="225" height="350" rx="20" class="cyan"/><text x="960" y="195" class="label">TASK</text><text x="960" y="240">SLAM / odometry</text><text x="960" y="285">Detection / tracking</text><text x="960" y="330">Segmentation</text><text x="960" y="375">Registration / change</text><text x="960" y="420">Self-supervision</text>
