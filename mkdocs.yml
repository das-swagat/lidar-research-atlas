site_name: LiDAR Research Atlas
site_description: Curated indoor and outdoor 2D/3D LiDAR datasets, point-cloud methods, SLAM, autonomous driving, robotics, remote sensing, benchmarks, ecosystem tools, and lawful access guides.
site_author: Swagat Das
site_url: https://das-swagat.github.io/lidar-research-atlas/
repo_url: https://github.com/das-swagat/lidar-research-atlas
repo_name: das-swagat/lidar-research-atlas
edit_uri: edit/main/docs/
copyright: "Original atlas content © 2026 Swagat Das · CC BY 4.0 · Third-party resources retain their own terms"

theme:
  name: material
  language: en
  logo: assets/images/logo.svg
  favicon: assets/images/logo.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.tooltips
    - search.highlight
    - search.share
    - toc.follow

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/atlas.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/das-swagat
    - icon: fontawesome/brands/researchgate
      link: https://www.researchgate.net/profile/Swagat-Das/research
  generator: false

nav:
  - Home: index.md
  - Get started:
      - Overview: getting-started/index.md
      - Use the atlas: getting-started/use-the-atlas.md
      - Verify a record: getting-started/verify-a-record.md
  - Catalog:
      - Datasets: catalog/datasets/index.md
      - Methods: catalog/methods/index.md
      - Research portals: catalog/portals/index.md
      - LiDAR ecosystem: catalog/ecosystem/index.md
  - Guides:
      - Choose a dataset: guides/choosing-a-dataset.md
      - Lawful download workflow: guides/lawful-download-workflow.md
      - Citation and attribution: guides/citation.md
      - Reproducibility checklist: guides/reproducibility.md
  - Domains:
      - Domain map: domains/index.md
      - Indoor robotics: domains/indoor.md
      - Outdoor autonomy: domains/outdoor.md
      - Aerial and geospatial: domains/aerial.md
      - Industrial and infrastructure: domains/industrial.md
  - Architectures:
      - Overview: architectures/index.md
      - 2D SLAM: architectures/2d-slam.md
      - 3D perception: architectures/3d-perception.md
      - Self-supervised learning: architectures/self-supervised.md
  - Legal and provenance:
      - Overview: legal/index.md
      - Access vocabulary: legal/access-and-licensing.md
      - Attribution: legal/attribution.md
      - Figures and media: legal/figure-reuse.md
      - Corrections and takedowns: legal/corrections.md
  - Contribute:
      - Overview: contributing/index.md
      - Add a dataset: contributing/add-dataset.md
      - Add a method: contributing/add-method.md
  - About:
      - Methodology: about/methodology.md
      - Source-list comparison: about/source-comparison.md
      - Coverage report: about/coverage-report.md
      - Cite the atlas: about/citation.md
      - ResearchGate mapping: about/researchgate.md
      - Repository settings: about/repository-settings.md
      - Roadmap: about/roadmap.md
      - Changelog: about/changelog.md
