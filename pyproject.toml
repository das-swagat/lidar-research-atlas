[project]
name = "lidar-research-atlas"
version = "0.2.0"
description = "A provenance-tracked atlas of indoor and outdoor 2D/3D LiDAR datasets, methods, and access guidance."
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Swagat Das"}]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
