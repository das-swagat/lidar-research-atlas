citation:
  instruction: Cite the original dataset publication and any additional provider-required references. Cite the atlas
    separately only when its curation or guidance was used.
  recommended_source: https://doi.org/10.1109/CVPR42600.2020.00252
download_guide:
  steps:
  - Open the official page linked above.
  - Read the current provider terms and confirm eligibility.
  - Create an account or submit the provider agreement when required.
  - Download only through provider-supported links or tools.
  - Obtain labels, calibration, maps, and development kits from their separately identified official sources.
  - Verify file integrity when provider checksums are available.
  - Preserve the original folder structure and citation notice.
  atlas_hosts_files: false
  atlas_mirrors_files: false
notes: Dataset terms are separate from licenses for code in Waymo repositories. Do not describe the dataset as open-source.
